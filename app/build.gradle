plugins {
    id "com.android.application" version "8.7.3"
}

android {
    namespace "io.github.skb8.eng"
    compileSdk 35
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "io.github.skb8.eng"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "0.1.0"

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}
